<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>mBot Mega Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div class="aura-bg">
        <div class="aura-layer-1" aria-hidden="true"></div>
        <div class="aura-layer-2" aria-hidden="true"></div>
        <div class="aura-layer-3" aria-hidden="true"></div>
        <div class="aura-layer-4" aria-hidden="true"></div>

        <div class="page-content">
            <header class="site-header">
                <a class="site-brand" href="/" aria-label="MBOT MEGA startsida">
                    <img src="{{ url_for('static', filename='logo.svg') }}" alt="MBOT MEGA">
                </a>
                <a class="site-title" href="/" aria-label="MBOT MEGA startsida">MBOT MEGA</a>
            </header>

            <main class="dashboard">
                <header class="dashboard-header">
                    <h1>Dashboard</h1>
                    <p class="subtitle">Livevideo och telemetri mBot Mega.</p>
                </header>

                <svg class="glass-definitions" aria-hidden="true">
                    <defs>
                        <filter id="lg" x="-20%" y="-20%" width="140%" height="140%">
                            <feTurbulence
                                type="fractalNoise"
                                baseFrequency="0.01 0.01"
                                numOctaves="3"
                                result="noise"
                            />
                            <feDisplacementMap
                                in="SourceGraphic"
                                in2="noise"
                                scale="10"
                                xChannelSelector="R"
                                yChannelSelector="G"
                            />
                        </filter>
                    </defs>
                </svg>

                <section class="video-card glass-panel" aria-labelledby="video-title">
                    <div class="section-heading">
                        <div>
                            <p class="section-kicker">Kamera 01</p>
                            <h2 id="video-title">Livevideofeed</h2>
                        </div>
                        <span class="live-indicator"><span></span> LIVE</span>
                    </div>
                    <div class="video-container">
                        <img src="/video_feed" alt="Livevideofeed från robotens kamera">
                    </div>
                </section>

                <section class="status-panel glass-panel" aria-labelledby="status-title">
                    <div class="section-heading">
                        <div>
                            <p class="section-kicker">System</p>
                            <h2 id="status-title">Status och telemetri</h2>
                        </div>
                    </div>
                    <div class="status-grid">
                        <p class="status-item">
                            <span class="label">Anslutning</span>
                            <span id="status" class="status-value status-connecting">Connecting...</span>
                        </p>
                        <p class="status-item">
                            <span class="label">Senaste uppdatering</span>
                            <span id="timestamp" class="telemetry-value">-</span>
                        </p>
                    </div>
                </section>
            </main>

            <footer class="site-footer">
                <div class="footer-inner">
                    <div>
                        <p class="footer-brand">vigge-pigge</p>
                        <p class="footer-copy">&copy; 2026 vigge-pigge. Alla rättigheter förbehållna.</p>
                    </div>
                    <div class="footer-links">
                        <a href="https://www.instagram.com/vilgotgrimvall/" target="_blank" rel="noopener noreferrer">
                            <span>Instagram:</span> @vilgotgrimvall
                        </a>
                        <a href="mailto:vilgot.grimvall@gmail.com">
                            <span>Mail:</span> vilgot.grimvall@gmail.com
                        </a>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script>
        const socket = io();
        const statusElement = document.getElementById('status');

        socket.on('connect', () => {
            statusElement.innerText = 'Connected';
            statusElement.className = 'status-value status-connected';
        });

        socket.on('disconnect', () => {
            statusElement.innerText = 'Disconnected';
            statusElement.className = 'status-value status-disconnected';
        });

        // Lyssna på telemetri-eventet från app.py
        socket.on('telemetry', (data) => {
            document.getElementById('timestamp').innerText = data.timestamp;
        });
    </script>
</body>
</html>
